    <br>
    Lozinka: <input type = "password" [(ngModel)] = "password" name = "qwijkoew">
    <select [(ngModel)] = "option" name = "jssa">

<form>

    <br>
    email: <input type="email" [(ngModel)] = "email" name = "ksa">
    <br>
    Korisnicko ime: <input type="text" [(ngModel)] = "_korisnicko_ime" name = "ksa">
    <br>
    Lozinka: <input type = "password" [(ngModel)] = "_password" name = "qwijkoew">
